name: "Benign calculator demo"
server:
  source: {type: path, path: "../demo_servers/benign_calc"}
  runtime: python
  install: {requirements: "requirements.txt"}
  command: ["python", "server.py"]
  startup_timeout_s: 30
  declared_capabilities: []
scan:
  mode: full
  total_timeout_s: 180
  static:
    llm_review: false
  dynamic:
    enabled: true
    call_timeout_s: 20
    max_calls_per_tool: 12
    max_total_calls: 200
    rugpull_delay_s: 10
policy:
  do_not_use_on: [critical]
  allow_network: false
llm:
  enabled: false
  provider_env: TRUSTPROBE_LLM_API_KEY
out_dir: ../out/benign_calc/
