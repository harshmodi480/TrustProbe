name: Playwright MCP
server:
  source:
    type: npm
    package: '@playwright/mcp'
  runtime: node
  command:
  - node
  - node_modules/@playwright/mcp/dist/index.js
  startup_timeout_s: 30
  declared_capabilities: []
scan:
  mode: static
  total_timeout_s: 180
  static:
    llm_review: false
  dynamic:
    enabled: false
    call_timeout_s: 20
    max_calls_per_tool: 12
    max_total_calls: 200
    rugpull_delay_s: 10
policy:
  do_not_use_on:
  - critical
  allow_network: true
llm:
  enabled: false
  provider_env: TRUSTPROBE_LLM_API_KEY
out_dir: C:\Users\modiha1\Downloads\MCP Scanner Final\MCP Scanner Final\out\Playwright_MCP
