    enabled: true
    call_timeout_s: 20
    max_calls_per_tool: 12
    max_total_calls: 200
    rugpull_delay_s: 10
policy:
  do_not_use_on:
  - critical
  allow_network: false
llm:
  enabled: false
  provider_env: TRUSTPROBE_LLM_API_KEY
out_dir: C:\Users\modiha1\Downloads\MCP Scanner Final\MCP Scanner Final\out\Benign_Calc
