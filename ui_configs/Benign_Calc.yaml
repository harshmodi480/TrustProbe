name: Benign Calc
server:
  source:
    type: path
    path: C:\Users\modiha1\Downloads\MCP Scanner Final\MCP Scanner Final\demo_servers\benign_calc
  runtime: python
  command:
  - python
  - server.py
  startup_timeout_s: 30
  declared_capabilities: []
  install:
    requirements: requirements.txt
scan:
  mode: full
  total_timeout_s: 180
  static:
    llm_review: false
